name: crawler-integration

on:
  pull_request:
    paths:
      - "apps/crawler/**"
      - ".github/workflows/crawler-integration.yml"
  push:
    branches: [main]
    paths:
      - "apps/crawler/**"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/crawler

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/crawler/requirements-dev.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Chromium is the only browser the crawler uses.
      - name: Install Playwright Chromium + system deps
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m pytest tests -x -v --ignore=tests/integration

      - name: Run integration tests (VulnSPA + progress events)
        run: python -m pytest tests/integration -x -v
        timeout-minutes: 8
