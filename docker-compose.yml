version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# internal  — service-to-service traffic only (never reaches the host)
# ─────────────────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
    internal: true   # no outbound internet from this network
  public:
    driver: bridge   # api, web, zap need outbound internet

# ─────────────────────────────────────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  nuclei_templates:           # cache downloaded Nuclei templates between restarts
  nuclei_templates_pentest:   # separate cache for pentest scanner instance
  ollama_data:                # persists downloaded LLM model weights (~2 GB)

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devsecops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-devsecops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devsecops} -d ${POSTGRES_DB:-devsecops}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: '1.0'

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: '0.5'

  # ── Database migrations (one-shot, runs before api starts) ─────────────────
  migrate:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: migrate          # uses CMD from migrate stage in Dockerfile
    # Use db push (schema sync) — avoids issues with migration files that
    # drop enum variants while rows referencing them still exist in the DB.
    command: ["node_modules/.bin/prisma", "db", "push", "--schema=apps/api/prisma/schema.prisma", "--skip-generate", "--accept-data-loss"]
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure        # retry until migrations succeed
    mem_limit: 256m
    cpus: '0.5'

  # ── DVWA — MariaDB backend ─────────────────────────────────────────────────
  # Dedicated DB for DVWA — kept separate from the platform's Postgres.
  dvwa-db:
    image: mariadb:10@sha256:407fccb51e710f34752c1a3ef9b936d1f55f38d4ac7fa043b3759742d266fd9a
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "dvwa", "-pp@ssw0rd"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 256m
    cpus: '0.5'

  # ── DVWA (Damn Vulnerable Web Application) — deliberate scan target ────────
  # A purposely-insecure app for testing DAST and Pentest scans.
  # Add domain "dvwa" in the platform to scan it (use http:// scheme).
  # Browse it at http://localhost:4280  (default login: admin / password)
  # First-time setup: visit http://localhost:4280/setup.php → click "Create / Reset Database"
  # ⚠️  Never expose this service to the internet — it is intentionally insecure.
  dvwa:
    image: ghcr.io/digininja/dvwa:latest@sha256:79c68f08bed0a862dc55363b90619fd2837270a6d4f235f05a7abf6679b37915
    restart: unless-stopped
    depends_on:
      dvwa-db:
        condition: service_healthy
    environment:
      DB_SERVER: dvwa-db
      DB_PORT: "3306"
      DB_USER: dvwa
      DB_PASSWORD: p@ssw0rd
      DB_DATABASE: dvwa
      DEFAULT_SECURITY_LEVEL: low   # low = most vulnerabilities visible for scanning
      RECAPTCHA_PUBLIC_KEY: ""
      RECAPTCHA_PRIVATE_KEY: ""
    networks:
      - internal    # reachable by ZAP (DAST) and scanner (Nuclei/pentest)
      - public      # required for host port binding (4280) on Docker Desktop
    ports:
      - "4280:80"   # host access for manual browsing — not needed for scans
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    cpus: '0.5'

  # ── DVWA DB init (one-shot) ─────────────────────────────────────────────────
  # Drives DVWA's own /setup.php → "Create / Reset Database" button via curl.
  # Manually creating tables via mysqli isn't enough: DVWA's index.php also
  # checks that the DB schema matches the version it expects, and forces a
  # 302 → /setup.php whenever it doesn't. Submitting setup.php properly
  # (with the CSRF user_token) lets DVWA build the schema itself, after
  # which /login.php returns 200 and scans (DAST/Pentest) work end-to-end.
  #
  # Safe to re-run — clicking "Create / Reset Database" idempotently rebuilds
  # everything. Compose's `restart: "no"` ensures it runs once per `up`.
  dvwa-init:
    image: ghcr.io/digininja/dvwa:latest@sha256:79c68f08bed0a862dc55363b90619fd2837270a6d4f235f05a7abf6679b37915
    restart: "no"
    depends_on:
      dvwa:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[dvwa-init] waiting for DVWA web service..."
        # DVWA's apache binds before MariaDB is reachable, so /setup.php may
        # 500 briefly. Retry until we get a non-error response.
        until curl -fsS -o /dev/null http://dvwa/setup.php; do sleep 2; done

        COOKIE_JAR=/tmp/dvwa-cookies.txt
        rm -f "$$COOKIE_JAR"

        echo "[dvwa-init] fetching /setup.php to capture CSRF user_token..."
        HTML=$$(curl -fsS -c "$$COOKIE_JAR" http://dvwa/setup.php)
        # CSRF field shape:  <input type='hidden' name='user_token' value='<32+ hex>' />
        TOKEN=$$(printf '%s' "$$HTML" \
          | grep -oE "name=['\"]user_token['\"][^>]*value=['\"][a-f0-9]+" \
          | grep -oE "[a-f0-9]{16,}" \
          | head -n1)

        if [ -z "$${TOKEN:-}" ]; then
          echo "[dvwa-init] ERROR: could not extract user_token from /setup.php" >&2
          printf '%s\n' "$$HTML" | head -n40 >&2
          exit 1
        fi

        echo "[dvwa-init] POSTing create_db with user_token..."
        curl -fsS -b "$$COOKIE_JAR" -c "$$COOKIE_JAR" \
          --data-urlencode "create_db=Create / Reset Database" \
          --data-urlencode "user_token=$$TOKEN" \
          http://dvwa/setup.php -o /dev/null

        # Verify: /login.php should return 200 now (no 302 → /setup.php).
        CODE=$$(curl -s -o /dev/null -w "%{http_code}" http://dvwa/login.php)
        echo "[dvwa-init] /login.php returns HTTP $$CODE"
        if [ "$$CODE" = "200" ]; then
          echo "[dvwa-init] DVWA setup complete. Default login: admin / password"
        else
          echo "[dvwa-init] WARN: /login.php returned $$CODE (expected 200)" >&2
        fi
    networks:
      - internal

  # ── OWASP Juice Shop — deliberate scan target ──────────────────────────────
  # A modern Node.js / TypeScript / Angular vulnerable web app — covers the
  # full OWASP Top 10 plus a long tail of API + crypto + SCA bugs.
  # Add domain "juice-shop" in the platform to scan it (use http:// scheme).
  # Browse it at http://localhost:4290
  # No DB sidecar needed — Juice Shop ships with an embedded SQLite.
  # ⚠️  Never expose this service to the internet — it is intentionally insecure.
  juice-shop:
    image: bkimminich/juice-shop:latest
    restart: unless-stopped
    # Juice Shop's challenge engine sometimes pegs CPU during scanner
    # enumeration; cap so it doesn't starve the api/scanner containers.
    mem_limit: 512m
    cpus: '1.0'
    networks:
      - internal    # reachable by ZAP (DAST) + scanner (Nuclei/pentest)
      - public      # required for host port binding on Docker Desktop
    ports:
      - "4290:3000" # host access for manual browsing — not needed for scans
    healthcheck:
      # Juice Shop's image strips sh + most BusyBox tools — only `node`
      # is reliably present. `wget --spider` fails not because the app
      # is unhealthy but because wget isn't on PATH. Use node directly.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── OWASP ZAP (DAST sidecar) ───────────────────────────────────────────────
  # Remove this service (and scanner's depends_on) if you don't need DAST scans.
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable@sha256:c4da4c234258d444d9988fce9d034b00323724818daa4c91ca46f09aa04b46db
    restart: unless-stopped
    # Cap JVM heap — without this Java will grab 25% of host RAM.
    # 3.5 GiB heap handles long proxy recordings + pentest traffic buffering
    # without GC thrashing. Symptom of too-low heap: the recorder shows 0 URLs
    # captured while browser traffic silently drops (GC saturates CPU).
    mem_limit: 4g
    mem_reservation: 2g
    environment:
      JVM_PROPERTIES: "-Xmx3584m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    # ZAP ships an alpha "Insights" addon (telemetry/observability) that
    # will issue Control.shutdown() mid-scan when its heuristic decides ZAP
    # is in a bad state. The log line is:
    #     [ZAP-Insights] Shutting down ZAP due to High Level Insight
    # which manifested as DAST scans completing in ~80 s with
    # `Connection refused` from the scanner — ZAP was actively terminating
    # itself during the spider/active-scan phase.
    #
    # The addon has no documented config to disable the auto-shutdown
    # behavior, so we delete the .zap plugin files before starting the daemon.
    # ZAP's addon loader simply skips the plugin directory entries it can't
    # find. Wrapped in `sh -c` so the rm runs before exec'ing zap.sh; `exec`
    # so signals (SIGTERM from `docker stop`) propagate correctly.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rm -f /zap/plugin/insights-*.zap;
        exec zap.sh
        -daemon
        -host 0.0.0.0
        -port 8080
        -config api.key=${ZAP_API_KEY:?ZAP_API_KEY is required}
        -config api.addrs.addr.name=.*
        -config api.addrs.addr.regex=true
        -config api.disablekey=false
    networks:
      - internal
      - public       # ZAP needs outbound access to scan external domains
    # Expose ZAP's listener on the host for the Interactive DAST recording flow.
    # Localhost-only so external attackers can't MITM through your proxy.
    # The user configures their browser proxy → http://127.0.0.1:8090.
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          curl -sf
          "http://localhost:8080/JSON/core/view/version/?apikey=${ZAP_API_KEY}"
          || exit 1
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s   # ZAP JVM startup is slow
    cpus: '2.5'

  # ── interactsh — Out-of-band (OAST) callback server for blind vuln detection ──
  # interactsh-server requires a real public IP/domain to function (DNS callbacks).
  #
  # Two operating modes:
  #
  #   1. **Public OAST (default)** — INTERACTSH_URL unset. Both nuclei (Phase 3
  #      vuln scan) AND the new Phase 27.6 OWASP-expansion modules (Phase 4.5
  #      ssrf_attacker, oob_collector) automatically use ProjectDiscovery's
  #      hosted OAST infrastructure (oast.pro / oast.fun). Works out of the box.
  #      Trade-off: callback metadata (target IPs, payload context) is visible
  #      to ProjectDiscovery's hosted infra.
  #
  #   2. **Self-hosted (privacy-preserving)** — set INTERACTSH_URL to the URL
  #      of your own interactsh-server. All callbacks stay private. Requires:
  #
  #          interactsh-server -d your-domain.com -i <public-ip> -sa
  #
  #      …running on a public IP with DNS A and NS records pointing at it.
  #      The Phase 27.6 oob_collector module reads INTERACTSH_URL and passes
  #      it to the interactsh-client subprocess via ``-server``.
  #
  # The scanner-pentest container is on the `public` network and has outbound
  # internet access for both modes.

  # ── Mock Wazuh API (Phase 28 Slice C — W3 validation) ────────────────────
  # Tiny FastAPI service that imitates the Wazuh Manager REST API endpoints
  # the wazuhIngestService calls. Lets us validate the full ingest →
  # runtimeBridge → correlation chain pipeline without standing up the real
  # Wazuh stack (manager + indexer + dashboard ≈ 3 GB of images).
  #
  # Returns 4 canned alerts on different rules (SSH brute-force, sudo,
  # file integrity, outbound C2) so the hourly-bucket fingerprint produces
  # 4 distinct RUNTIME findings instead of collapsing everything into one.
  #
  # Operator path to real Wazuh: stop this service, deploy real Wazuh,
  # set WAZUH_API_URL to point at it. No code changes needed.
  mock-wazuh:
    build:
      context: .
      dockerfile: docker/mock-wazuh.Dockerfile
    profiles: ["pentest"]    # opt-in; same gate as scanner-pentest
    restart: unless-stopped
    environment:
      MOCK_WAZUH_USER:     ${WAZUH_API_USER:-admin}
      MOCK_WAZUH_PASSWORD: ${WAZUH_API_PASSWORD:-admin}
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    cpus: '0.25'

  # ── Playwright crawler sidecar (Phase 1) ──────────────────────────────────
  # Chromium-based SPA crawler invoked by the scanner during DAST scans.
  # Routes every browser request through ZAP so the active-scan phase has
  # full visibility into dynamically-loaded pages + XHR endpoints that
  # ZAP's built-in spider can't see on modern React/Vue/Angular apps.
  crawler:
    build:
      context: .
      dockerfile: docker/crawler.Dockerfile
    restart: unless-stopped
    environment:
      # Empty string disables the proxy — handy for unit tests against a
      # stand-alone crawl. Production wiring points at the ZAP daemon.
      ZAP_PROXY_URL: ${CRAWLER_ZAP_PROXY_URL:-http://zap:8080}
      LOG_LEVEL: ${CRAWLER_LOG_LEVEL:-info}
      CRAWLER_HARD_MAX_PAGES: ${CRAWLER_HARD_MAX_PAGES:-500}
      CRAWLER_HARD_MAX_DURATION_SECS: ${CRAWLER_HARD_MAX_DURATION_SECS:-900}
    # Chromium + shared-memory heavy pages need more /dev/shm than Docker's
    # 64 MB default or they OOM-crash mid-crawl.
    shm_size: 1gb
    networks:
      - internal
      - public    # Chromium fetches target pages + remote assets
    depends_on:
      zap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: '1.5'

  # ── VulnSPA — deterministic crawler integration-test fixture ──────────────
  # Static nginx serving apps/crawler/tests/fixtures/vulnspa. Only started
  # under `--profile test` so production compose-up doesn't spin it.
  # The crawler integration tests hit http://vulnspa:80 over the internal
  # network (offline, reproducible, <50 ms per page).
  vulnspa:
    image: nginx:1.27-alpine
    profiles: ["test"]
    restart: "no"
    volumes:
      - ./apps/crawler/tests/fixtures/vulnspa:/usr/share/nginx/html:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    mem_limit: 64m
    cpus: '0.25'

  # ── Scanner microservice ────────────────────────────────────────────────────
  scanner:
    image: devsecops-scanner:latest   # fixed name so scanner-pentest can use FROM devsecops-scanner:latest
    build:
      context: .
      dockerfile: docker/scanner.Dockerfile
    restart: unless-stopped
    environment:
      SCAN_WORKSPACE_DIR: /tmp/scan_workspace
      ZAP_BASE_URL: ${ZAP_BASE_URL:-http://zap:8080}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      # Crawler sidecar — scanner invokes /crawl before active scan.
      CRAWLER_URL: ${CRAWLER_URL:-http://crawler:8001}
      INTERACTSH_URL: ${INTERACTSH_URL:-}
      # Flush print() in real time so `docker logs` shows scan progress live
      PYTHONUNBUFFERED: "1"
    volumes:
      - nuclei_templates:/home/scanner/nuclei-templates    # nuclei v3 stores templates here
    networks:
      - internal
      - public    # needs outbound: git clone, trivy db, nuclei templates
    depends_on:
      zap:
        condition: service_healthy
      crawler:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 3g
    cpus: '2.0'

  # ── Scanner (pentest) — opt-in via `--profile pentest` ────────────────────
  # Extends the base scanner with nmap, nikto, testssl, subfinder, httpx,
  # ffuf, sqlmap, and xsstrike.  The API routes PENTEST_FULL jobs to this
  # service when SCANNER_PENTEST_URL is set.
  scanner-pentest:
    image: devsecops-scanner-pentest:latest
    build:
      context: .
      dockerfile: docker/scanner-pentest.Dockerfile
    profiles: ["pentest"]
    restart: unless-stopped
    environment:
      SCAN_WORKSPACE_DIR: /tmp/scan_workspace
      ZAP_BASE_URL: ${ZAP_BASE_URL:-http://zap:8080}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      # Crawler sidecar — pentest scanner calls /crawl before Nuclei to
      # enumerate URLs (SPA routes, XHR endpoints, form walks).
      CRAWLER_URL: ${CRAWLER_URL:-http://crawler:8001}
      INTERACTSH_URL: ${INTERACTSH_URL:-}
      # Flush print() in real time so `docker logs` shows scan progress live
      PYTHONUNBUFFERED: "1"
    volumes:
      - nuclei_templates_pentest:/home/scanner/nuclei-templates    # nuclei v3 stores templates here
    networks:
      - internal
      - public
    depends_on:
      zap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 6g

  # ── Ollama — local LLM inference (CPU mode, no GPU required) ─────────────
  # Opt-in service. Enable with COMPOSE_PROFILES=ai (or pentest,ai) in .env,
  # or run: docker compose --profile ai up -d
  # When disabled, AI features (autofix, triage, chat, FP detection, etc.) fail open.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal   # API communicates with Ollama on the internal network
      - public     # Ollama needs outbound internet to download model weights
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    # 7B-class models (qwen2.5-coder:7b) at num_ctx=8192 need ~7 GiB.
    # 4 GiB caused "Load failed: context canceled" OOM aborts.
    mem_limit: 8g
    cpus: '4.0'

  # ── Ollama model pull (one-shot: downloads model on first start) ───────────
  # Safe to re-run — ollama pull is a no-op when model is already present.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5-coder:7b}"]
    networks:
      - internal   # reaches Ollama server
      - public     # downloads model weights from Ollama registry
    restart: "no"

  # ── API server ──────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SCANNER_URL: http://scanner:8000
      SCANNER_PENTEST_URL: ${SCANNER_PENTEST_URL:-http://scanner-pentest:8000}
      API_INTERNAL_URL: http://api:3000
      NODE_ENV: ${NODE_ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      INTERACTSH_URL: ${INTERACTSH_URL:-}
      # Wazuh ingest — points at mock-wazuh by default (W3 validation).
      # Operators with a real Wazuh manager set WAZUH_API_URL to the
      # manager's API endpoint and the same credentials work.
      WAZUH_API_URL:      ${WAZUH_API_URL:-http://mock-wazuh:8080}
      WAZUH_API_USER:     ${WAZUH_API_USER:-admin}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-admin}
      WAZUH_INSECURE_TLS: ${WAZUH_INSECURE_TLS:-true}
      WAZUH_POLL_INTERVAL_SECONDS: ${WAZUH_POLL_INTERVAL_SECONDS:-60}
      # Wazuh 4.x: alerts live in the indexer (port 9200), not behind the
      # manager API. When unset, ingest falls back to the legacy manager
      # path which only works on Wazuh ≤ 4.12.
      WAZUH_INDEXER_URL:      ${WAZUH_INDEXER_URL:-}
      WAZUH_INDEXER_USER:     ${WAZUH_INDEXER_USER:-}
      WAZUH_INDEXER_PASSWORD: ${WAZUH_INDEXER_PASSWORD:-}
    networks:
      - internal
      - public     # needs outbound: GitHub API calls
    ports:
      - "3000:3000"    # exposed for direct API access / GitHub OAuth callback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scanner:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: '1.0'

  # ── Web frontend (nginx) ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    networks:
      - internal    # proxies to api over internal network
    ports:
      - "80:80"     # the only port users hit
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 2g
    cpus: '2.0'

  # ── Cloudflare Tunnel — public reachability for CI/CD ─────────────────────
  #
  # Phase A6 — exposes the BreachLens UI + API on a public hostname so
  # GitHub Actions runners (and any other external caller) can reach the
  # local deployment without opening firewall ports. Routes through the
  # web service (nginx) which already proxies /api → api:3000 and serves
  # the SPA from /, so a single tunnel hostname carries both surfaces.
  #
  # Opt-in via the `tunnel` profile — operators who don't need public
  # access never start the cloudflared container. Drop the profile flag
  # once you've validated the tunnel and want it always running.
  #
  # Setup (full runbook: docs/runbooks/cloudflare-tunnel.md):
  #   1. Create a tunnel in the Cloudflare Zero Trust dashboard
  #   2. Copy the connector token Cloudflare generates
  #   3. Set CLOUDFLARE_TUNNEL_TOKEN in .env
  #   4. Configure the tunnel's public hostname → Service: HTTP, URL: web:80
  #   5. Run: docker compose --profile tunnel up -d cloudflared
  #
  # Cloudflare manages the DNS record automatically — you don't add an A
  # record manually. The connector announces itself to Cloudflare's edge
  # over a persistent outbound HTTPS connection (no inbound ports).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:8080 run
    environment:
      # Connector token from the Cloudflare Zero Trust dashboard — looks
      # like `eyJh...` (long base64). Pin in .env, never commit. Without
      # it the container exits immediately with a clear error.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN required — see docs/runbooks/cloudflare-tunnel.md}
    networks:
      - internal     # reaches web service over the internal network
      - public       # outbound to the Cloudflare edge
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Cloudflared exposes a /ready endpoint when --metrics is set;
      # returns 200 once the connector has registered with Cloudflare's
      # edge. A returning 503 means "not connected yet" — useful for
      # the operator to debug DNS / token misconfigurations.
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready | grep -q '\"status\":200' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    cpus: '0.5'
